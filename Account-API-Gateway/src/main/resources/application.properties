spring.application.name=Account-API-Gateway

server.port=8000

spring.cloud.gateway.server.webflux.routes[0].id=account-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/accounts/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/accounts(?<remaining>/?.*), /api/v1/internal/accounts$\{remaining}

springdoc.swagger-ui.urls[0].name=Account Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/account-service
eureka.client.enabled=false